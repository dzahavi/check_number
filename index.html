<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten Digit Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: one left-aligned working column. Ten separate digit cells grouped 3-3-4, a check button, and a result strip below. */
  :root {
    --bg: #eef0ee;
    --surface: #f9faf9;
    --fg: #17201d;
    --muted: #5d6a65;
    --line: #c9d0cc;
    --accent: #0d5c4f;
    --accent-fg: #f4faf8;
    --ok: #146c43;
    --ok-bg: #dff1e6;
    --bad: #a3282a;
    --bad-bg: #f8e1e0;
    --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111715;
      --surface: #18201d;
      --fg: #e6ece9;
      --muted: #94a39d;
      --line: #2e3a36;
      --accent: #5ec4ae;
      --accent-fg: #0b1512;
      --ok: #6fd69b;
      --ok-bg: #173325;
      --bad: #ff8c88;
      --bad-bg: #3a1c1c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111715;
    --surface: #18201d;
    --fg: #e6ece9;
    --muted: #94a39d;
    --line: #2e3a36;
    --accent: #5ec4ae;
    --accent-fg: #0b1512;
    --ok: #6fd69b;
    --ok-bg: #173325;
    --bad: #ff8c88;
    --bad-bg: #3a1c1c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  :root { color-scheme: light; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  h1 {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: clamp(1.6rem, 6vw, 2.1rem);
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
  }
  .lede { margin: 8px 0 0; color: var(--muted); max-width: 46ch; }

  form { display: flex; flex-direction: column; gap: 20px; }
  .label {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cells {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr)) 10px repeat(3, minmax(0, 1fr)) 10px repeat(4, minmax(0, 1fr));
    gap: clamp(3px, 1.2vw, 8px);
    margin-top: 8px;
  }
  .sep { display: block; }
  .cell {
    width: 100%;
    min-width: 0;
    aspect-ratio: 3 / 4;
    padding: 0;
    text-align: center;
    font-family: var(--font-mono);
    font-size: clamp(1.1rem, 5vw, 1.7rem);
    font-weight: 500;
    color: var(--fg);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 4px;
    caret-color: var(--accent);
  }
  .cell:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .cells[data-state="ok"] .cell { border-color: var(--ok); }
  .cells[data-state="bad"] .cell { border-color: var(--bad); }

  .field { display: flex; flex-direction: column; gap: 8px; }
  .name-input {
    font: inherit;
    width: 100%;
    max-width: 360px;
    min-height: 46px;
    padding: 12px 14px;
    color: var(--fg);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 4px;
  }
  .name-input::placeholder { color: var(--muted); }
  .name-input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 4px;
    cursor: pointer;
    min-height: 46px;
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--accent-fg); border: 1.5px solid var(--accent); }
  .primary:hover { filter: brightness(1.08); }
  .secondary { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
  .secondary:hover { border-color: var(--muted); }

  .result {
    min-height: 56px;
    padding: 14px 16px;
    border-radius: 4px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .result[data-state="ok"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .result[data-state="bad"] { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .result[data-state="warn"] { color: var(--fg); }
  .result strong { font-weight: 600; }
  .mark { font-family: var(--font-mono); font-weight: 600; font-size: 1.25rem; line-height: 1; }

  @media (prefers-reduced-motion: no-preference) {
    .cell, .result { transition: border-color 0.15s ease, background-color 0.15s ease; }
  }
</style>

</head>
<body>
<main>
  <header>
    <h1>Ten Digit Check</h1>
    <p class="lede">Type or paste a 10-digit number to see whether it matches the stored one.</p>
  </header>

  <form id="check-form" autocomplete="off" novalidate>
    <div class="field">
      <label class="label" for="user-name">Your name</label>
      <input class="name-input" id="user-name" type="text" maxlength="40" autocomplete="given-name" placeholder="For example, David">
    </div>
    <div>
      <span class="label" id="cells-label">Enter 10 digits</span>
      <div class="cells" id="cells" role="group" aria-labelledby="cells-label" data-state="idle"></div>
    </div>
    <div class="actions">
      <button type="submit" class="primary" id="check-btn">Check number</button>
      <button type="button" class="secondary" id="clear-btn">Clear</button>
    </div>
    <div class="result" id="result" role="status" aria-live="polite" data-state="idle">
      <span id="result-text">Enter all 10 digits, then press Check number.</span>
    </div>
  </form>
</main>

<script>
(function () {
  var TARGET = "2134567890";
  var LENGTH = 10;
  var cellsEl = document.getElementById("cells");
  var resultEl = document.getElementById("result");
  var resultText = document.getElementById("result-text");
  var inputs = [];
  var nameEl = document.getElementById("user-name");
  var NAME_KEY = "ten-digit-check-name";

  try { nameEl.value = localStorage.getItem(NAME_KEY) || ""; } catch (err) {}
  nameEl.addEventListener("input", function () {
    try { localStorage.setItem(NAME_KEY, nameEl.value.trim()); } catch (err) {}
  });
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function who() {
    var n = nameEl.value.trim();
    return n ? ", " + esc(n) : "";
  }

  for (var i = 0; i < LENGTH; i++) {
    if (i === 3 || i === 6) {
      var sep = document.createElement("span");
      sep.className = "sep";
      sep.setAttribute("aria-hidden", "true");
      cellsEl.appendChild(sep);
    }
    var inp = document.createElement("input");
    inp.className = "cell";
    inp.id = "digit-" + (i + 1);
    inp.type = "text";
    inp.inputMode = "numeric";
    inp.maxLength = 1;
    inp.autocomplete = "off";
    inp.setAttribute("aria-label", "Digit " + (i + 1) + " of " + LENGTH);
    inp.dataset.index = String(i);
    cellsEl.appendChild(inp);
    inputs.push(inp);
  }

  function setState(state, html) {
    cellsEl.dataset.state = state;
    resultEl.dataset.state = state;
    resultText.innerHTML = html;
  }
  function resetState() {
    if (cellsEl.dataset.state !== "idle") {
      setState("idle", "Enter all 10 digits, then press Check number.");
    }
  }
  function value() {
    return inputs.map(function (el) { return el.value; }).join("");
  }
  function focusCell(n) {
    if (n >= 0 && n < LENGTH) { inputs[n].focus(); inputs[n].select(); }
  }
  function fillFrom(start, digits) {
    var n = start;
    for (var k = 0; k < digits.length && n < LENGTH; k++, n++) inputs[n].value = digits[k];
    focusCell(Math.min(n, LENGTH - 1));
  }

  inputs.forEach(function (el, idx) {
    el.addEventListener("input", function () {
      var digits = el.value.replace(/\D/g, "");
      el.value = "";
      resetState();
      if (digits) fillFrom(idx, digits);
    });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Backspace" && !el.value && idx > 0) {
        e.preventDefault();
        inputs[idx - 1].value = "";
        focusCell(idx - 1);
        resetState();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault(); focusCell(idx - 1);
      } else if (e.key === "ArrowRight") {
        e.preventDefault(); focusCell(idx + 1);
      }
    });
    el.addEventListener("focus", function () { el.select(); });
    el.addEventListener("paste", function (e) {
      var text = (e.clipboardData || window.clipboardData).getData("text") || "";
      var digits = text.replace(/\D/g, "");
      e.preventDefault();
      if (!digits) return;
      resetState();
      fillFrom(idx, digits);
    });
  });

  document.getElementById("check-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = value();
    if (v.length < LENGTH) {
      var missing = LENGTH - v.length;
      setState("warn", "Enter all 10 digits first. " + missing + " still empty.");
      cellsEl.dataset.state = "idle";
      var firstEmpty = inputs.findIndex(function (el) { return !el.value; });
      focusCell(firstEmpty);
      return;
    }
    if (v === TARGET) {
      setState("ok", '<span class="mark" aria-hidden="true">&#10003;</span><span><strong>Match' + who() + '.</strong> This is the stored number.</span>');
    } else {
      setState("bad", '<span class="mark" aria-hidden="true">&#10005;</span><span><strong>No match' + who() + '.</strong> This is not the stored number.</span>');
    }
  });

  document.getElementById("clear-btn").addEventListener("click", function () {
    inputs.forEach(function (el) { el.value = ""; });
    setState("idle", "Enter all 10 digits, then press Check number.");
    focusCell(0);
  });
})();
</script>
</body>
</html>
